services:
  db:
    image: docker.io/library/postgres:17   
    restart: always          
    environment:
      - POSTGRES_DB=flextools_slt  
      - POSTGRES_USER=flextools_slt          
      - POSTGRES_PASSWORD=flextools_slt  
    volumes: 
      - postgres_data:/var/lib/postgresql/data  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flextools_slt"]  
      interval: 1s  
      timeout: 3s  
      retries: 5

  app: 
    build: .       
    ports:
      - "5000:5000" 
    environment:
      - DATABASE_URI=postgresql://flextools_slt:flextools_slt@db:5432/flextools_slt
      - FLASK_ENV=development  
    depends_on:
      db: 
        condition: service_healthy
    volumes:
      - ./flextools_slt:/app   

volumes:
  postgres_data:  